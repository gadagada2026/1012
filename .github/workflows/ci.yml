name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        # 内网测试（依赖 192.168.110.52）不在 CI 运行，仅跑本地 demo 测试
        run: uv run pytest --ignore=tests/ui/test_hdf_login.py --ignore=tests/ui/test_contract_add.py
